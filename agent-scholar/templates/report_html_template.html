<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            line-height: 1.7;
            color: #333;
            background: #f8f9fa;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 30px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 15px;
            margin-bottom: 12px;
            font-size: 2.2em;
        }

        h2 {
            color: #34495e;
            margin-top: 40px;
            margin-bottom: 20px;
            font-size: 1.7em;
            border-left: 4px solid #3498db;
            padding-left: 15px;
        }

        h3 {
            color: #2c3e50;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        h4 {
            color: #34495e;
            margin-top: 22px;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .meta-info {
            color: #7f8c8d;
            font-size: 0.9em;
            margin: 4px 0 24px;
        }

        p {
            margin: 10px 0;
        }

        .summary {
            background: #ecf0f1;
            padding: 18px 22px;
            border-radius: 5px;
            margin: 18px 0;
        }

        ul,
        ol {
            margin: 12px 0;
            padding-left: 28px;
        }

        li {
            margin: 6px 0;
        }

        blockquote {
            border-left: 4px solid #3498db;
            padding: 10px 20px;
            margin: 15px 0;
            background: #f8f9fa;
            color: #555;
            font-style: italic;
        }

        hr {
            border: none;
            border-top: 1px solid #ecf0f1;
            margin: 32px 0;
        }

        strong {
            color: #2c3e50;
        }

        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: "Courier New", monospace;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #3498db;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        .footer {
            text-align: center;
            color: #95a5a6;
            font-size: 0.85em;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ecf0f1;
        }
    </style>
</head>
<body>
    <div class="container">
        {{ content }}
        <div class="footer">
            <p>{{ generation_time }}</p>
            <p>由 Agent Scholar 自动生成 / Generated by Agent Scholar</p>
        </div>
    </div>
</body>
</html>
